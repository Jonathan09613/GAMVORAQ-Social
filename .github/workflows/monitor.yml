name: GAMVORAQ Social | Monitoreo web

on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Verificar disponibilidad PWA
    if: vars.PRODUCTION_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Obtener scripts de monitoreo
        uses: actions/checkout@v4
      - name: Instalar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Probar sitio publicado (HTTPS)
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
        run: node scripts/release/smoke-http.mjs "$PRODUCTION_URL"
